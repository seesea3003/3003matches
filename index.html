<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff8ef" />
  <title>噗叽消消乐</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="噗叽消消乐首页">
        <span class="brand-mark">✦</span>
        <span>噗叽消消乐</span>
      </a>
      <button class="icon-button" id="soundButton" type="button" aria-label="切换音效" title="切换音效">♫</button>
    </header>

    <section class="hero">
      <div>
        <p class="eyebrow">把喜欢的照片变成游戏</p>
        <h1>交换、连线、<br><em>噗叽一下！</em></h1>
        <p class="intro">三个相同图案连成一线即可消除。上传你的照片，打造专属的消消乐棋盘。</p>
      </div>

      <div class="stats" aria-label="游戏数据">
        <div class="stat-card score-card">
          <span>当前得分</span>
          <strong id="score">0</strong>
        </div>
        <button class="restart-button" id="restartButton" type="button">
          <span>↻</span> 重新开局
        </button>
      </div>
    </section>

    <section class="game-layout">
      <aside class="tool-panel">
        <div class="panel-heading">
          <span class="panel-icon">◉</span>
          <div>
            <h2>我的图案</h2>
            <p>上传 1–8 张图片</p>
          </div>
        </div>

        <label class="upload-zone" id="uploadZone" for="imageUpload">
          <input id="imageUpload" type="file" accept="image/*" multiple />
          <span class="upload-icon">＋</span>
          <strong>选择照片</strong>
          <small>也可拖放到这里</small>
        </label>

        <div class="image-list" id="imageList" aria-live="polite"></div>

        <div class="tip-box">
          <span>✦</span>
          <p><strong>小提示</strong><br>至少使用 4 种图案，游戏会更有趣。</p>
        </div>
      </aside>

      <section class="board-wrap">
        <div class="board-toolbar">
          <p id="statusText"><span class="pulse-dot"></span> 选择两个相邻方块进行交换</p>
          <span class="combo" id="comboBadge">准备好了</span>
        </div>
        <div class="board" id="board" role="grid" aria-label="消消乐棋盘"></div>
      </section>
    </section>

    <footer>
      <span>噗叽消消乐</span>
      <span>照片仅保存在你的浏览器中</span>
    </footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
